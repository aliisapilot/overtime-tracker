name: Backend regression checks
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-checks.yml'
  push:
    branches:
      - 'perf/lazy-audit-logs'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-checks.yml'
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node backend/test/backend-test.js
      - run: node backend/test/site-assignment-test.js
      - run: node backend/test/login-reliability-test.js
